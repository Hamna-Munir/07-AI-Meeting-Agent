<svg viewBox="0 0 1600 500" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#F4F7FC"/>
      <stop offset="100%" stop-color="#EAF1FB"/>
    </linearGradient>
    <linearGradient id="headlineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#1E3A8A" stop-opacity="0.14"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1D4ED8"/>
    </marker>
  </defs>

  <rect width="1600" height="500" fill="url(#bgGrad)"/>
  <rect x="18" y="18" width="1564" height="464" rx="20" fill="none" stroke="#1E3A8A" stroke-opacity="0.08" stroke-width="2"/>

  <!-- badge -->
  <rect x="60" y="44" width="452" height="44" rx="22" fill="#2563EB" fill-opacity="0.10" stroke="#1D4ED8" stroke-opacity="0.6"/>
  <text x="84" y="72" font-family="'Consolas','Courier New',monospace" font-size="17" fill="#1D4ED8" letter-spacing="1">&lt;/&gt;  WEEK 07  ·  90 DAYS OF AI ENGINEERING</text>

  <!-- headline -->
  <text x="58" y="212" font-size="92" font-weight="800" fill="#0F172A">Meeting </text>
  <text x="486" y="212" font-size="92" font-weight="800" fill="url(#headlineGrad)">Agent</text>

  <!-- subtext -->
  <rect x="60" y="248" width="5" height="72" fill="#2563EB"/>
  <text x="86" y="272" font-size="22" fill="#1E293B">Reads a message, checks your calendar, proposes times,</text>
  <text x="86" y="302" font-size="22" fill="#1E293B">and books the meeting once you approve it.</text>

  <!-- tagline -->
  <text x="60" y="358" font-size="20" font-style="italic" fill="#5B6B82">An AI agent that helps you schedule meetings, powered by real <tspan fill="#1D4ED8" font-style="normal">Google Calendar</tspan> integration.</text>

  <!-- hero: robot mascot + flow -->
  <g transform="translate(1230,175)">

    <line x1="-220" y1="30" x2="220" y2="30" stroke="#1D4ED8" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="3 9"/>

    <!-- chat bubble -->
    <g transform="translate(-220,30)">
      <rect x="-46" y="-36" width="92" height="66" rx="16" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="2.5"/>
      <path d="M-14,30 L-14,50 L8,30 Z" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="2.5" stroke-linejoin="round"/>
      <line x1="-26" y1="-14" x2="26" y2="-14" stroke="#1D4ED8" stroke-width="3" stroke-linecap="round"/>
      <line x1="-26" y1="2" x2="10" y2="2" stroke="#1D4ED8" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- flat robot mascot, centered -->
    <g transform="translate(0,-10)">
      <line x1="0" y1="-78" x2="0" y2="-60" stroke="#0F172A" stroke-width="4" stroke-linecap="round"/>
      <circle cx="0" cy="-84" r="7" fill="#2563EB"/>
      <rect x="-42" y="-58" width="84" height="62" rx="18" fill="#FFFFFF" stroke="#0F172A" stroke-width="4"/>
      <circle cx="-16" cy="-30" r="8" fill="#1D4ED8"/>
      <circle cx="16" cy="-30" r="8" fill="#1D4ED8"/>
      <path d="M-14,-10 Q0,0 14,-10" fill="none" stroke="#0F172A" stroke-width="3.5" stroke-linecap="round"/>
      <rect x="-50" y="10" width="100" height="66" rx="16" fill="#2563EB" stroke="#0F172A" stroke-width="4"/>
      <rect x="-28" y="28" width="56" height="30" rx="8" fill="#FFFFFF" stroke="#0F172A" stroke-width="2.5"/>
      <circle cx="-12" cy="43" r="5" fill="#1D4ED8"/>
      <circle cx="12" cy="43" r="5" fill="#1D4ED8"/>
      <line x1="-50" y1="34" x2="-72" y2="20" stroke="#0F172A" stroke-width="5" stroke-linecap="round"/>
      <circle cx="-72" cy="20" r="8" fill="#FFFFFF" stroke="#0F172A" stroke-width="3.5"/>
      <line x1="50" y1="34" x2="72" y2="20" stroke="#0F172A" stroke-width="5" stroke-linecap="round"/>
      <circle cx="72" cy="20" r="8" fill="#FFFFFF" stroke="#0F172A" stroke-width="3.5"/>
    </g>

    <!-- calendar + check -->
    <g transform="translate(220,30)">
      <rect x="-40" y="-34" width="80" height="70" rx="10" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="2.5"/>
      <line x1="-40" y1="-12" x2="40" y2="-12" stroke="#1D4ED8" stroke-width="2.5"/>
      <path d="M-16,6 L-4,20 L20,-8" fill="none" stroke="#1D4ED8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <text x="-220" y="100" text-anchor="middle" font-size="15" fill="#5B6B82">Request</text>
    <text x="0" y="100" text-anchor="middle" font-size="15" fill="#5B6B82">AI matches slot</text>
    <text x="220" y="100" text-anchor="middle" font-size="15" fill="#5B6B82">Booked</text>
  </g>

  <!-- pipeline strip -->
  <line x1="60" y1="410" x2="1540" y2="410" stroke="#D6E2F5" stroke-width="1"/>
  <g font-size="16" fill="#0F172A">
    <g transform="translate(60,436)">
      <rect width="150" height="40" rx="20" fill="url(#chipGrad)" stroke="#1D4ED8" stroke-opacity="0.5"/>
      <text x="75" y="26" text-anchor="middle">Understand</text>
    </g>
    <path d="M222,456 L246,456" stroke="#1D4ED8" stroke-width="2" marker-end="url(#arrow)"/>
    <g transform="translate(256,436)">
      <rect width="150" height="40" rx="20" fill="url(#chipGrad)" stroke="#1D4ED8" stroke-opacity="0.5"/>
      <text x="75" y="26" text-anchor="middle">Check calendar</text>
    </g>
    <path d="M418,456 L442,456" stroke="#1D4ED8" stroke-width="2" marker-end="url(#arrow)"/>
    <g transform="translate(452,436)">
      <rect width="150" height="40" rx="20" fill="url(#chipGrad)" stroke="#1D4ED8" stroke-opacity="0.5"/>
      <text x="75" y="26" text-anchor="middle">Suggest slots</text>
    </g>
    <path d="M614,456 L638,456" stroke="#1D4ED8" stroke-width="2" marker-end="url(#arrow)"/>
    <g transform="translate(648,436)">
      <rect width="150" height="40" rx="20" fill="url(#chipGrad)" stroke="#1D4ED8" stroke-opacity="0.5"/>
      <text x="75" y="26" text-anchor="middle">Your approval</text>
    </g>
    <path d="M810,456 L834,456" stroke="#1D4ED8" stroke-width="2" marker-end="url(#arrow)"/>
    <g transform="translate(844,436)">
      <rect width="150" height="40" rx="20" fill="url(#chipGrad)" stroke="#2563EB" stroke-opacity="0.6"/>
      <text x="75" y="26" text-anchor="middle">Create event</text>
    </g>
  </g>
</svg>
